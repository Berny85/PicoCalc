# =============================================================================
# PicoCalc - Produktion (Debian-NUC, /srv/containers/picocalc)
# =============================================================================
# Abgeleitet von der laufenden Compose-Datei auf dem NUC (Umzug vom 17.09.2026).
#
# WICHTIG: Im Repo liegt zusätzlich die Entwicklungs-Datei "docker-compose.yaml". Ein einfaches
# "docker compose ..." würde diese nehmen. Deshalb immer mit -f arbeiten (deploy.sh tut das) oder in der
# .env auf dem Server einmalig setzen:
#     COMPOSE_FILE=docker-compose.prod.yml
#
# Zugangsdaten stehen in der .env auf dem Server (nicht im Repo): DB_PASSWORD (Pflicht), SECRET_KEY.
# Daten liegen relativ zu diesem Ordner: ./db_data (PostgreSQL) und ./storage (SVG-Konverter).
# =============================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: picocalc-db
    restart: unless-stopped
    volumes:
      - ./db_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=printcalc
      - POSTGRES_USER=printuser
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD fehlt in der .env}
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U printuser -d printcalc"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  web:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: picocalc-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://printuser:${DB_PASSWORD:?DB_PASSWORD fehlt in der .env}@db:5432/printcalc
      - SECRET_KEY=${SECRET_KEY:-}
      - FILE_STORAGE_PATH=/app/storage
    volumes:
      - ./storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - DOZZLE_BASE=/
      - DOZZLE_LEVEL=info
